# Sub-action: windows-microsoft-store — build MSIX + submit to Microsoft Store
# The Store re-signs the MSIX, so NO code-signing cert / Azure Trusted Signing is
# needed — only the Partner Center developer account + submission-API creds.
# Compose Desktop emits no MSIX, so this action packages one (build-msix.ps1) from
# the createReleaseDistributable app image + the vault-managed identity values, then
# submits it via the Partner Center submission API.
name: 'KMP Publish Desktop — Microsoft Store (build MSIX + Partner Center submission)'
description: 'Package a Compose Desktop app image as MSIX and submit it to the Microsoft Store via Partner Center.'
author: 'Mifos Initiative'
branding: { icon: 'send', color: 'purple' }

inputs:
  desktop_package_name:            { required: true,  description: 'Gradle desktop module (e.g. cmp-desktop)' }
  flavor:                          { required: false, default: 'prod', description: 'Gradle flavor' }
  version:                         { required: false, default: '', description: 'App version (auto from versionFile when empty); sanitized to MSIX a.b.c.0' }
  icon_path:                       { required: false, default: 'cmp-desktop/icons/ic_launcher.png', description: 'Square source PNG for MSIX tile assets' }
  # MSIX identity — MUST match the Partner Center reservation (vault: windows_msix_*).
  windows_msix_identity_name:      { required: true,  description: 'Package/Identity/Name' }
  windows_msix_publisher:          { required: true,  description: 'Package/Identity/Publisher (CN=...)' }
  windows_msix_publisher_display_name: { required: true, description: 'Package/Properties/PublisherDisplayName' }
  # Partner Center submission API (vault: ms_partner_center_* + ms_app_id).
  ms_partner_center_tenant_id:     { required: true,  description: 'Partner Center AAD tenant ID' }
  ms_partner_center_client_id:     { required: true,  description: 'Partner Center AAD client ID' }
  ms_partner_center_client_secret: { required: true,  description: 'Partner Center AAD client secret' }
  ms_app_id:                       { required: true,  description: 'Microsoft Store app product ID (Store ID)' }
  release_flight:                  { required: false, default: '', description: 'Optional flight name (empty → mainstream)' }
  java-version:                    { required: false, default: '17', description: 'JDK version' }

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-java@v4
      with: { distribution: zulu, java-version: '${{ inputs.java-version }}' }

    - name: Build release distributable (app image)
      shell: bash
      env: { FLAVOR: '${{ inputs.flavor }}', PKG: '${{ inputs.desktop_package_name }}' }
      run: ./gradlew ":$PKG:createReleaseDistributable" "-PflavorDimension=$FLAVOR"

    - name: Locate app image + sanitize version
      id: img
      shell: bash
      env: { PKG: '${{ inputs.desktop_package_name }}', VERSION_IN: '${{ inputs.version }}' }
      run: |
        set -euo pipefail
        APPDIR=$(find "$PKG/build/compose/binaries/main-release/app" -mindepth 1 -maxdepth 1 -type d | head -1)
        [[ -d "$APPDIR" ]] || { echo "::error::app image dir not found"; exit 1; }
        echo "app_dir=$APPDIR" >> "$GITHUB_OUTPUT"
        echo "display_name=$(basename "$APPDIR")" >> "$GITHUB_OUTPUT"
        # MSIX version must be 4-part numeric a.b.c.0 — strip any -beta.N+sha suffix.
        RAW="${VERSION_IN:-}"
        if [[ -z "$RAW" && -f version.txt ]]; then RAW=$(cat version.txt); fi
        NUM=$(echo "${RAW:-1.0.0}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo "1.0.0")
        echo "msix_version=${NUM}.0" >> "$GITHUB_OUTPUT"

    - name: Package MSIX
      shell: pwsh
      run: |
        ${{ github.action_path }}/../_shared/scripts/windows/build-msix.ps1 `
          -AppImageDir          "${{ steps.img.outputs.app_dir }}" `
          -IconPng              "${{ inputs.icon_path }}" `
          -ManifestTemplate     "${{ github.action_path }}/AppxManifest.xml.template" `
          -OutputMsix           "${{ runner.temp }}/app-store.msix" `
          -IdentityName         "${{ inputs.windows_msix_identity_name }}" `
          -Publisher            "${{ inputs.windows_msix_publisher }}" `
          -PublisherDisplayName "${{ inputs.windows_msix_publisher_display_name }}" `
          -DisplayName          "${{ steps.img.outputs.display_name }}" `
          -Version              "${{ steps.img.outputs.msix_version }}"

    - name: Acquire Partner Center access token
      id: token
      shell: pwsh
      env:
        TENANT_ID:     ${{ inputs.ms_partner_center_tenant_id }}
        CLIENT_ID:     ${{ inputs.ms_partner_center_client_id }}
        CLIENT_SECRET: ${{ inputs.ms_partner_center_client_secret }}
      run: |
        $body = @{
          grant_type    = 'client_credentials'
          client_id     = $env:CLIENT_ID
          client_secret = $env:CLIENT_SECRET
          resource      = 'https://manage.devcenter.microsoft.com'
        }
        $resp = Invoke-RestMethod -Method Post `
          -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/token" `
          -Body $body
        "::add-mask::$($resp.access_token)" | Write-Host
        "ACCESS_TOKEN=$($resp.access_token)" >> $env:GITHUB_OUTPUT

    - name: Submit MSIX to Partner Center
      shell: pwsh
      env:
        ACCESS_TOKEN:   ${{ steps.token.outputs.ACCESS_TOKEN }}
        APP_ID:         ${{ inputs.ms_app_id }}
        MSIX_PATH:      ${{ runner.temp }}/app-store.msix
        RELEASE_FLIGHT: ${{ inputs.release_flight }}
      run: |
        if (-not (Test-Path $env:MSIX_PATH)) { throw "MSIX not found at $env:MSIX_PATH" }
        $headers = @{ Authorization = "Bearer $env:ACCESS_TOKEN" }
        $endpoint = if ([string]::IsNullOrEmpty($env:RELEASE_FLIGHT)) {
          "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:APP_ID/submissions"
        } else {
          "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:APP_ID/flights/$env:RELEASE_FLIGHT/submissions"
        }
        $submission = Invoke-RestMethod -Method Post -Uri $endpoint -Headers $headers
        Write-Host "Submission created: $($submission.id)"
        $uploadUrl = $submission.fileUploadUrl
        Invoke-RestMethod -Method Put -Uri $uploadUrl `
          -Headers @{ 'x-ms-blob-type' = 'BlockBlob' } `
          -InFile $env:MSIX_PATH
        $commitUrl = "$endpoint/$($submission.id)/commit"
        Invoke-RestMethod -Method Post -Uri $commitUrl -Headers $headers
        Write-Host "Submission $($submission.id) committed to Partner Center."
